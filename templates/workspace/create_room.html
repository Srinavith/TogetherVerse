{% extends 'base.html' %}
{% block title %}Create Room — TogetherVerse{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="matrix-panel p-4">
      <div class="section-label mb-0">node_initialization</div>
      <h3 class="mt-1 mb-0">CREATE NODE</h3>
      <div class="glow-line"></div>

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">// NODE_NAME <span style="color:var(--danger);">*</span></label>
          <input type="text" name="name" class="form-control"
                 placeholder="e.g. project_alpha" required/>
        </div>

        <div class="mb-3">
          <label class="form-label">// DESCRIPTION</label>
          <textarea name="description" class="form-control" rows="3"
                    placeholder="// what is this node for?"></textarea>
        </div>

        <div class="mb-4">
          <div class="form-check">
            <input type="checkbox" name="is_private"
                   class="form-check-input" id="isPrivate"/>
            <label class="form-check-label" for="isPrivate"
                   style="font-family:'Share Tech Mono',monospace;
                          font-size:0.82rem;color:var(--text-secondary);">
              <i class="bi bi-lock"></i> &nbsp;RESTRICTED_ACCESS (private)
            </label>
          </div>
          <div class="form-text">// private nodes are hidden from the public grid</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-matrix-solid">
            DEPLOY NODE &nbsp;<i class="bi bi-arrow-right"></i>
          </button>
          <a href="{% url 'room_list' %}" class="btn btn-matrix">ABORT</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
