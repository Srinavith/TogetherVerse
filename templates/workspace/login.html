{% extends 'base.html' %}
{% block title %}Login — TogetherVerse{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="matrix-panel p-4">

      <div class="section-label mb-0">auth_terminal_v2</div>
      <h3 class="mt-1 mb-0">SYSTEM ACCESS</h3>
      <div class="glow-line"></div>

      <form method="POST">
        {% csrf_token %}

        {% if form.errors %}
          <div class="alert alert-danger mb-3">
            ✗ &nbsp;AUTH_FAILED — invalid credentials
          </div>
        {% endif %}

        <div class="mb-3">
          <label class="form-label">// USERNAME</label>
          <input type="text" name="username" class="form-control"
                 placeholder="enter_handle" autofocus required/>
        </div>

        <div class="mb-4">
          <label class="form-label">// ACCESS_KEY</label>
          <input type="password" name="password" class="form-control"
                 placeholder="••••••••" required/>
        </div>

        <button type="submit" class="btn btn-matrix-solid w-100">
          AUTHENTICATE &nbsp;<i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <p style="text-align:center;margin-top:1.2rem;
                font-family:'Share Tech Mono',monospace;
                font-size:0.78rem;color:var(--text-muted);">
        No identity?
        <a href="{% url 'register' %}" style="color:var(--matrix-green);">REGISTER</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
